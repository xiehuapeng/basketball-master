[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-analyzer"
version = "0.1.0"
description = "Engineering-oriented basketball shooting pose analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "mediapipe==0.10.14",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
remote = [
  "inference-sdk>=0.30",
  "huggingface_hub>=0.30",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
basketball-analyzer = "basketball_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
